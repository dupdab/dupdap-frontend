name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - run: npx prettier --check .

      - run: npm run verify

      # Fails CI when required production env vars are missing or invalid (#803).
      - name: Validate environment
        run: node scripts/validate-env.mjs
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Analyze bundle
        run: npm run analyze
        env:
          ANALYZE: 'true'

      - name: Test
        run: npm test -- --run
